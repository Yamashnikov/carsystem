<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}会員ページ{% endblock %} - 中古車販売管理システム（β版）</title>
  <style>
    body { font-family: "Yu Gothic", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4em; border-bottom: 2px solid #333; padding-bottom: 8px; }
    h2 { font-size: 1.1em; margin-top: 2em; background: #eee; padding: 6px 10px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { padding: 6px; width: 100%; max-width: 320px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 20px; background: #333; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #555; }
    .error { color: #b00020; }
    .success { color: #0a7a2f; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    td, th { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 0.95em; }
    th { background: #f5f5f5; width: 35%; }
    .locked { color: #888; }
    nav { margin-bottom: 20px; font-size: 0.9em; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  {% if request.session.customer_id %}
  <nav>
    <a href="{% url 'members:mypage' %}">マイページ</a>
    <a href="{% url 'members:logout' %}">ログアウト</a>
  </nav>
  {% endif %}
  {% for message in messages %}
    <p class="success">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
