<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}スタッフ画面{% endblock %} - 中古車販売管理システム（β版）</title>
  <style>
    body { font-family: "Yu Gothic", sans-serif; max-width: 960px; margin: 30px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5em; border-bottom: 3px solid #2c5f4f; padding-bottom: 8px; color: #2c5f4f; }
    h2 { font-size: 1.1em; margin-top: 1.6em; }
    header.topbar { display: flex; justify-content: space-between; align-items: center;
                    background: #2c5f4f; color: #fff; padding: 10px 20px; margin: -30px -16px 24px -16px; }
    header.topbar a { color: #fff; text-decoration: none; margin-left: 16px; font-size: 0.9em; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { padding: 7px; width: 100%; max-width: 360px; margin-top: 4px; box-sizing: border-box;
                    border: 1px solid #ccc; border-radius: 4px; }
    button, .btn { margin-top: 18px; padding: 10px 24px; background: #2c5f4f; color: #fff; border: none;
                   border-radius: 4px; cursor: pointer; font-size: 1em; display: inline-block; text-decoration: none; }
    button:hover, .btn:hover { background: #1e4738; }
    .btn-secondary { background: #888; }
    .big-link { display: block; padding: 24px; margin: 12px 0; background: #f2f6f4; border: 1px solid #cfe0d8;
                border-radius: 8px; text-decoration: none; color: #222; font-size: 1.15em; }
    .big-link:hover { background: #e4efe9; }
    .success { color: #0a7a2f; background: #eafaf0; padding: 10px 14px; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    td, th { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 0.95em; }
    th { background: #f5f5f5; }
    tr:hover td { background: #fafafa; }
    .search-box { margin-bottom: 16px; }
    .search-box input { display: inline-block; width: 300px; }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>中古車販売管理システム（β版）</strong>
    <div>
      {% if request.user.is_authenticated %}
        <a href="{% url 'staff:home' %}">ホーム</a>
        <a href="{% url 'staff:customer_list' %}">顧客一覧</a>
        <a href="{% url 'staff:logout' %}">ログアウト</a>
      {% endif %}
    </div>
  </header>
  {% for message in messages %}
    <p class="success">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
