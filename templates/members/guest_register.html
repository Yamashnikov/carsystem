{% extends "base.html" %}
{% block title %}新規登録{% endblock %}
{% block content %}
<h1>新規会員登録</h1>
<p>このフォームは、ご案内いただいたお客様専用の登録ページです。必要事項をご入力ください。</p>
{% if form.errors %}<p class="error">{{ form.errors }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endfor %}
  <button type="submit">登録する</button>
</form>
{% endblock %}
