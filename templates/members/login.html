{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<h1>会員ログイン</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <label for="id_member_id">会員ID</label>
  {{ form.member_id }}
  <label for="id_password">パスワード</label>
  {{ form.password }}
  <button type="submit">ログイン</button>
</form>
<p style="margin-top:2em; color:#888; font-size:0.9em;">
  会員IDとパスワードは、管理者から発行されたものをご利用ください。<br>
  初回ログイン時はパスワードの変更が必要です。
</p>
{% endblock %}
